  /api/v1/webhook/whatsapp/status:
    get:
      summary: WhatsApp webhook verify / status
      responses:
        '200':
          description: Successful response
    post:
      summary: WhatsApp webhook events
      responses:
        '200':
          description: Successful response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppWebhookDto'
components:
  schemas:
    SignupDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        roleName:
          type: string
        gender:
          type: string
          enum:
          - male
          - female
          - other
      required:
      - email
      - password
      - firstName
      - lastName
      - roleName
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    SendGridEventDto:
      type: object
      properties:
        email:
          type: string
        event:
          type: string
        ip:
          type: string
        response:
          type: string
        sg_message_id:
          type: string
        smtp-id:
          type: string
        timestamp:
          type: number
    TermiiDLRDto:
      type: object
      properties:
        type:
          type: string
        receiver:
          type: string
        sender:
          type: string
        message:
          type: string
        messageId:
          type: string
        status:
          type: string
    WhatsAppStatusDto:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        timestamp:
          type: string
    WhatsAppWebhookDto:
      type: object
      description: WhatsApp webhook payload (entry array etc.)
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
