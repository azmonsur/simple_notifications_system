version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notifpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://notif:notifpass@postgres:5432/notifications
      RABBITMQ_URL: amqp://rabbitmq
      JWT_SECRET: change_this_in_prod
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: password123
      NODE_ENV: production
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: http://localhost:4000/api/v1/admin
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  rabbitdata:
