version: '3.8'
services:
  server:
    image: your-registry/notification-server:latest
    restart: always
    env_file:
      - ./env/server.env
    ports:
      - "8080:8080"
    depends_on:
      - db
      - rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 2048M
      replicas: 3

  worker:
    image: your-registry/notification-worker:latest
    restart: always
    env_file:
      - ./env/server.env
    deploy:
      replicas: 10
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M

  client:
    image: your-registry/notification-client:latest
    restart: always
    env_file:
      - ./env/client.env
    ports:
      - "80:80"
    deploy:
      replicas: 2

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      replicas: 1

volumes:
  pgdata:
  rabbitmq-data: