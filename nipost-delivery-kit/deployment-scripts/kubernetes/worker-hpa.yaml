apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-worker-hpa
  namespace: notification-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60