apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-server
  namespace: notification-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-server
  template:
    metadata:
      labels:
        app: notification-server
    spec:
      containers:
        - name: server
          image: your-registry/notification-server:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: notif-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15